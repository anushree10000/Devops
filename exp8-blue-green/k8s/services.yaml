# LIVE service  -> what real users hit          (http://localhost:30008)
# PREVIEW service -> the new, idle environment  (http://localhost:30018)
# Switching blue <-> green = changing the "version" in the LIVE selector.
apiVersion: v1
kind: Service
metadata:
  name: demo-app-live
  namespace: exp8
spec:
  type: NodePort
  selector:
    app: demo-app
    version: blue
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30008
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-preview
  namespace: exp8
spec:
  type: NodePort
  selector:
    app: demo-app
    version: green
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30018
