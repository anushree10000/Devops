# Hardened Kubernetes deployment for the patient portal.
# The API token Secret is NOT stored in Git - Jenkins creates it from a Jenkins credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patient-portal
  namespace: healthcare
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-portal
  namespace: healthcare
  labels:
    app: patient-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-portal
  template:
    metadata:
      labels:
        app: patient-portal
    spec:
      serviceAccountName: patient-portal
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patient-portal
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: patient-portal-secret
                  key: api-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: patient-portal
  namespace: healthcare
spec:
  type: NodePort
  selector:
    app: patient-portal
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30009        # http://localhost:30009
